$schema: http://json-schema.org/draft-07/schema#
title: AbortMultipartUploadCommandV1
type: object
additionalProperties: false
required:
  - commandId
  - uploadSessionId
  - bucket
  - objectKey
  - uploadId
properties:
  commandId:
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    description: ULID shared by the outbox row and AMQP message.
  uploadSessionId:
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  bucket:
    type: string
    minLength: 1
  objectKey:
    type: string
    minLength: 1
  uploadId:
    type: string
    minLength: 1
