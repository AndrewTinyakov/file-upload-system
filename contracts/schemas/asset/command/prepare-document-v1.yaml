$schema: http://json-schema.org/draft-07/schema#
title: PrepareDocumentCommandV1
type: object
additionalProperties: false
required:
  - commandId
  - assetId
  - preparationStartedAt
  - sourceBucket
  - sourceObjectKey
  - sourceContentType
  - sourceByteSize
  - sourceObjectEtag
  - destinationBucket
  - destinationPrefix
properties:
  commandId:
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    description: ULID shared by the outbox row, AMQP message, and outcome event.
  assetId:
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    description: ULID of the file asset being prepared.
  preparationStartedAt:
    type: string
    format: date-time
    description: UTC timestamp when the API moved the asset to PREPARING.
  sourceBucket:
    type: string
    minLength: 1
  sourceObjectKey:
    type: string
    minLength: 1
  sourceContentType:
    type: string
    minLength: 1
  sourceByteSize:
    type: integer
    format: int64
    minimum: 0
  sourceObjectEtag:
    type: string
    minLength: 1
    description: Opaque object validator. It is not a content hash.
  destinationBucket:
    type: string
    minLength: 1
  destinationPrefix:
    type: string
    minLength: 1
    pattern: '/$'
