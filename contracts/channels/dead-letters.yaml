deadLetteredDeleteAssetPrefixCommand:
  address: asset.prefix.delete.v1
  description: Asset cleanup command after its delivery limit is exhausted.
  messages:
    DeleteAssetPrefixCommandV1:
      $ref: ../messages.yaml#/messages/DeleteAssetPrefixCommandV1
  bindings:
    amqp:
      is: routingKey
      exchange:
        name: asset.dead
        type: topic
        durable: true
        autoDelete: false
        vhost: /
      bindingVersion: 0.3.0

backendAssetCleanupDead:
  address: backend.asset-cleanups-dead
  description: Durable queue retaining exhausted asset cleanup commands.
  messages:
    DeleteAssetPrefixCommandV1:
      $ref: ../messages.yaml#/messages/DeleteAssetPrefixCommandV1
  bindings:
    amqp:
      is: queue
      queue:
        name: backend.asset-cleanups-dead
        durable: true
        exclusive: false
        autoDelete: false
        vhost: /
      bindingVersion: 0.3.0

