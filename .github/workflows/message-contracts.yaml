name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: workers/go.sum

      - name: Install contract tooling
        run: npm ci

      - name: Validate message contracts
        run: npm run validate:asyncapi

      - name: Check generated Kotlin models
        run: |
          npm run generate:asyncapi:kotlin
          git add --intent-to-add api/src/generated/asyncapi/kotlin
          git diff --exit-code -- api/src/generated/asyncapi/kotlin

      - name: Check generated Go models
        run: |
          npm run generate:asyncapi:go
          git add --intent-to-add workers/internal/generated/messaging
          git diff --exit-code -- workers/internal/generated/messaging

      - name: Typecheck client
        run: npm run typecheck:client

      - name: Test benchmark helpers
        run: >-
          node --test
          benchmark/tests/drain.test.mjs
          benchmark/tests/evaluate.test.mjs
          benchmark/tests/runner.test.mjs
          benchmark/tests/storage-cleanup.test.mjs
          benchmark/tests/storage-settings.test.mjs

      - name: Install libvips
        timeout-minutes: 2
        run: |
          echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: Test API units and check Kotlin style
        run: ./api/gradlew -p api unitTest ktlintCheck --no-daemon

      - name: Vet Go workers
        run: go -C workers vet ./...

      - name: Test Go workers
        run: go -C workers test ./...
